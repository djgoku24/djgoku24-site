<!DOCTYPE html>
<html>
<head>
<style>
  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  #bandeau {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 36px;
    display: flex;
    align-items: center;
    background-color: red;
    color: white;
    overflow: hidden;
    white-space: nowrap;
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;
  }

  #rssText {
    display: flex;
    align-items: center;
    height: 100%;
    white-space: nowrap;
  }

  #rssText p {
    display: flex;
    align-items: center;
    height: 100%;
    margin: 0 22px;
    font-size: 16px;
    line-height: 1;
  }
</style>
</head>
<body>

<div id="bandeau">
  <div id="rssText">Chargement du flux RSS en cours...</div>
</div>

<script>
let titles;
let index = 0;

function fetchRSS() {
    fetch('/api/news')
    .then(response => response.json())
    .then(data => {
        if (!data.items || data.items.length === 0) {
            throw new Error('Nessuna notizia disponibile.');
        }

        titles = data.items.map(item => item.title);

        document.getElementById('rssText').innerHTML =
            "<p>" + titles.join('</p><p> &#8226; </p><p>') + "</p>";

        scrollText();
    })
    .catch(error => console.error('Errore RSS:', error));
}

// JavaScript pour récupérer et faire défiler le flux RSS
window.addEventListener('load', () => {
    fetchRSS();
    setInterval(fetchRSS, 600000); // Rafraîchir le flux toutes les 10 minutes (600 000 millisecondes)
});

function scrollText() {
    let element = document.getElementById('rssText');
    let textWidth = element.scrollWidth; // Correction de la largeur du texte
    let screenWidth = window.innerWidth;
    let pos = screenWidth;

    function animate() {
        pos -= 1; // Vous pouvez ajuster la vitesse en modifiant cette valeur
        element.style.transform = 'translateX(' + pos + 'px)';
        if (pos < -textWidth + screenWidth) {
            pos = screenWidth;
        }
        requestAnimationFrame(animate);
    }
    animate();
}
</script>

</body>
</html>
