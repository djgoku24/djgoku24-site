<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>METEO PALERMO ULTRA PREMIUM</title>

<style>

:root{
    --glass:rgba(255,255,255,.08);
    --white:#fff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:transparent;
}

/* VIDEO BACKGROUND */

.bg{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 20% 20%,#26408f 0%, transparent 40%),
    radial-gradient(circle at 80% 30%,#4b1d95 0%, transparent 30%),
    radial-gradient(circle at 50% 80%,#123b81 0%, transparent 35%),
    linear-gradient(180deg,#030712,#081126);
    animation:bgMove 20s ease infinite;
}

@keyframes bgMove{
    0%{filter:hue-rotate(0deg);}
    50%{filter:hue-rotate(20deg);}
    100%{filter:hue-rotate(0deg);}
}

/* STELLE */

.stars{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.stars span{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:twinkle 3s infinite;
}

@keyframes twinkle{
    50%{
        opacity:.2;
        transform:scale(.5);
    }
}

/* CARD */

.weather{
    width:950px;
    height:540px;

    position:relative;
    overflow:hidden;

   background:
linear-gradient(
135deg,
rgba(10,20,45,.75),
rgba(15,30,60,.55)
);

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    border:1px solid rgba(255,255,255,.25);

    border-radius:35px;

   box-shadow:
0 15px 50px rgba(0,0,0,.45),
0 0 40px rgba(74,144,226,.15),
inset 0 1px 0 rgba(255,255,255,.2);

    color:white;
}

/* HEADER */

.header{
    text-align:center;
    padding-top:18px;
}

.city{
    font-size:34px;
    font-weight:700;
}

.date{
    opacity:.8;
    margin-top:5px;
}

/* MAIN */

.main{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:40px 60px;
}

.temp{
    font-size:120px;
    font-weight:200;
    text-shadow:0 0 20px rgba(255,255,255,.3);
}

/* ICONA METEO */

.weather-icon{
    position:relative;
    width:220px;
    height:180px;
}

.sun{
    position:absolute;
    top:10px;
    right:70px;

    width:70px;
    height:70px;

    border-radius:50%;
    background:#ffd500;

    box-shadow:
    0 0 20px #ffd500,
    0 0 50px #ffd500;

    animation:pulse 4s infinite;
}

.cloud{
    position:absolute;
    bottom:50px;
    left:35px;

    width:120px;
    height:50px;
    background:white;
    border-radius:100px;
}

.cloud::before{
    content:'';
    position:absolute;
    width:70px;
    height:70px;
    left:15px;
    top:-35px;
    background:white;
    border-radius:50%;
}

.cloud::after{
    content:'';
    position:absolute;
    width:55px;
    height:55px;
    right:15px;
    top:-25px;
    background:white;
    border-radius:50%;
}

/* GOCCE */

.rain{
    position:absolute;
    left:65px;
    bottom:0;
}

.rain span{
    display:inline-block;
    width:3px;
    height:25px;
    margin:4px;
    background:#7dd3fc;
    animation:rain .8s infinite linear;
}

.rain span:nth-child(2){animation-delay:.2s}
.rain span:nth-child(3){animation-delay:.4s}

@keyframes rain{
    0%{
        opacity:0;
        transform:translateY(0);
    }
    100%{
        opacity:1;
        transform:translateY(20px);
    }
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
    }
}

/* CONDIZIONI */

.conditions{
    text-align:center;
}

.status{
    font-size:42px;
    margin-bottom:15px;
}

.stats{
    display:flex;
    gap:35px;
    font-size:22px;
}

/* FORECAST */

.forecast{
    position:absolute;
    bottom:0;
    left:0;

    width:100%;
    height:150px;

    display:flex;
    justify-content:space-evenly;
    align-items:center;

    background:rgba(255,255,255,.05);
    border-top:1px solid rgba(255,255,255,.15);
}

.hour{
    text-align:center;
    transition:.3s;
}

.hour:hover{
    transform:scale(1.1);
}

.hour-time{
    color:#cbd5e1;
}

.hour-icon{
    font-size:40px;
    margin:8px 0;
}

.hour-temp{
    font-weight:bold;
}

/* OROLOGIO DIGITALE */

.clock{
    position:absolute;
    top:20px;
    right:25px;

    padding:10px 18px;

    border-radius:15px;

    background:rgba(255,255,255,.08);
}




</style>
</head>
<body>



<div class="weather">

<div class="clock" id="clock"></div>

<div class="header">
    <div class="city">Palermo, Sicilia</div>
    <div class="date">Condizioni Meteo Live</div>
</div>

<div class="main">

    <div class="temp">17°C</div>

    <div class="weather-icon">

        <div class="sun"></div>

        <div class="cloud"></div>

        <div class="rain">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <div class="conditions">

        <div class="status">Pioggia</div>

        <div class="stats">
            <div>💨 8.7 m/s</div>
            <div>💧 77%</div>
            <div>🧭 763 mmHg</div>
        </div>

    </div>

</div>

<div class="forecast">

    <div class="hour">
        <div class="hour-time">18:00</div>
        <div class="hour-icon">🌦️</div>
        <div class="hour-temp">17°</div>
    </div>

    <div class="hour">
        <div class="hour-time">19:00</div>
        <div class="hour-icon">🌦️</div>
        <div class="hour-temp">17°</div>
    </div>

    <div class="hour">
        <div class="hour-time">20:00</div>
        <div class="hour-icon">🌦️</div>
        <div class="hour-temp">16°</div>
    </div>

    <div class="hour">
        <div class="hour-time">21:00</div>
        <div class="hour-icon">🌧️</div>
        <div class="hour-temp">16°</div>
    </div>

    <div class="hour">
        <div class="hour-time">22:00</div>
        <div class="hour-icon">🌧️</div>
        <div class="hour-temp">16°</div>
    </div>

    <div class="hour">
        <div class="hour-time">23:00</div>
        <div class="hour-icon">🌧️</div>
        <div class="hour-temp">15°</div>
    </div>

</div>

</div>

<script>

// OROLOGIO

function updateClock(){
    const now = new Date();

    document.getElementById('clock')
    .innerHTML=
    now.toLocaleTimeString('it-IT',{
        hour:'2-digit',
        minute:'2-digit'
    });
}

updateClock();
setInterval(updateClock,1000);


// STELLE

for(let i=0;i<150;i++){

    let star=document.createElement('span');

    star.style.left=Math.random()*100+'vw';
    star.style.top=Math.random()*100+'vh';

    star.style.animationDuration=
        Math.random()*4+2+'s';

    document.getElementById('stars')
    .appendChild(star);
}

</script>

</body>
</html>
