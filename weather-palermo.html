<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meteo</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif}

body{
  width:100%;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(160deg,#0a1f3d,#0b1030);
  color:#fff;
}

.card{
  height:100%;
  padding:10px 12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* RIGA 1: città + orologio */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.city{font-size:14px;font-weight:700}

.clock{
  font-size:11px;
  opacity:.85;
  background:rgba(255,255,255,.08);
  padding:2px 8px;
  border-radius:8px;
}

/* RIGA 2: icona + temperatura + condizioni */
.main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.left{
  display:flex;
  align-items:center;
  gap:10px;
}

.temp{
  font-size:34px;
  font-weight:300;
  line-height:1;
}

.cond{
  text-align:right;
  font-size:11px;
  line-height:1.5;
  opacity:.9;
}

.cond b{
  display:block;
  font-size:13px;
  opacity:1;
}

/* ===== ICONA ANIMATA COMPATTA ===== */
.wx{
  position:relative;
  width:64px;
  height:56px;
  flex-shrink:0;
  transform:scale(.55);
  transform-origin:left center;
  margin:-14px 0;
}

.sun{
  position:absolute;
  top:6px;
  right:22px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:#ffd500;
  box-shadow:0 0 18px #ffd500,0 0 42px #ffd500;
  animation:pulse 4s infinite;
}

.moon{
  position:absolute;
  top:6px;
  right:26px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#e8eefc;
  box-shadow:0 0 18px rgba(200,220,255,.8);
}

.moon::after{
  content:'';
  position:absolute;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#0b1030;
  top:-7px;
  left:-9px;
}

.cloud{
  position:absolute;
  bottom:16px;
  left:8px;
  width:78px;
  height:32px;
  background:#fff;
  border-radius:100px;
  animation:drift 6s ease-in-out infinite;
}

.cloud::before{
  content:'';
  position:absolute;
  width:44px;
  height:44px;
  left:10px;
  top:-22px;
  background:#fff;
  border-radius:50%;
}

.cloud::after{
  content:'';
  position:absolute;
  width:34px;
  height:34px;
  right:12px;
  top:-16px;
  background:#fff;
  border-radius:50%;
}

@keyframes drift{50%{transform:translateX(5px)}}
@keyframes pulse{50%{transform:scale(1.08)}}

.rain{position:absolute;left:26px;bottom:0}

.rain span{
  display:inline-block;
  width:3px;height:14px;margin:2px;
  background:#7dd3fc;border-radius:2px;
  animation:rain .8s infinite linear;
}

.rain span:nth-child(2){animation-delay:.2s}
.rain span:nth-child(3){animation-delay:.4s}

@keyframes rain{
  0%{opacity:0;transform:translateY(-6px)}
  100%{opacity:1;transform:translateY(12px)}
}

.bolt{
  position:absolute;left:38px;bottom:2px;
  width:0;height:0;
  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-top:18px solid #ffd500;
  filter:drop-shadow(0 0 8px #ffd500);
  animation:flash 1.2s infinite;
}

@keyframes flash{0%,100%{opacity:.2}50%{opacity:1}}

/* RIGA 3: previsioni compatte */
.forecast{
  display:flex;
  justify-content:space-between;
  gap:4px;
  background:rgba(255,255,255,.06);
  border-radius:10px;
  padding:6px 8px;
}

.hour{text-align:center;flex:1}
.hour-time{font-size:10px;opacity:.7}
.hour-icon{font-size:14px;margin:1px 0}
.hour-temp{font-size:11px;font-weight:700}

.loading{
  display:flex;align-items:center;justify-content:center;
  height:100%;opacity:.7;font-size:13px;
}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="loading">Caricamento meteo…</div>
</div>

<script>
/* ===== CAMBIA SOLO QUESTO PER OGNI CITTÀ ===== */
const CONFIG = {
  city:"Palermo",
  lat:38.1157,
  lon:13.3615
};
/* ============================================== */

const LABELS = {
  0:"Sereno",1:"Poco nuvoloso",2:"Nuvoloso",3:"Molto nuvoloso",
  45:"Nebbia",48:"Nebbia",51:"Pioviggine",53:"Pioviggine",55:"Pioviggine",
  61:"Pioggia debole",63:"Pioggia",65:"Pioggia forte",
  71:"Neve",73:"Neve",75:"Neve forte",
  80:"Rovesci",81:"Rovesci",82:"Rovesci forti",
  95:"Temporale",96:"Temporale",99:"Temporale"
};

function kindOf(code){
  if(code===0||code===1) return "clear";
  if(code===2||code===3||code===45||code===48) return "cloud";
  if(code>=51&&code<=67) return "rain";
  if(code>=71&&code<=77) return "snow";
  if(code>=80&&code<=82) return "rain";
  if(code>=95) return "storm";
  return "cloud";
}

function iconHTML(code,isDay){
  const k = kindOf(code);
  if(k==="clear") return isDay ? `<div class="sun"></div>` : `<div class="moon"></div>`;
  if(k==="cloud") return (isDay?`<div class="sun"></div>`:`<div class="moon"></div>`)+`<div class="cloud"></div>`;
  if(k==="rain") return `<div class="cloud"></div><div class="rain"><span></span><span></span><span></span></div>`;
  if(k==="snow") return `<div class="cloud"></div>`;
  if(k==="storm") return `<div class="cloud"></div><div class="rain"><span></span><span></span></div><div class="bolt"></div>`;
  return `<div class="cloud"></div>`;
}

function render(data){
  const c = data.current;
  const h = data.hourly;
  const nowHour = new Date(c.time).getHours();

  const hours = [];
  for(let i=0;i<h.time.length && hours.length<5;i++){
    const d = new Date(h.time[i]);
    if(d.getHours() >= nowHour){
      hours.push({
        t:d.getHours().toString().padStart(2,"0")+":00",
        c:h.weather_code[i],
        temp:Math.round(h.temperature_2m[i])
      });
    }
  }

  document.getElementById("card").innerHTML = `
    <div class="top">
      <div class="city">${CONFIG.city}</div>
      <div class="clock" id="clock"></div>
    </div>

    <div class="main">
      <div class="left">
        <div class="wx">${iconHTML(c.weather_code, c.is_day===1)}</div>
        <div class="temp">${Math.round(c.temperature_2m)}°</div>
      </div>
      <div class="cond">
        <b>${LABELS[c.weather_code] || "Meteo"}</b>
        💨 ${c.wind_speed_10m} km/h<br>
        💧 ${c.relative_humidity_2m}%
      </div>
    </div>

    <div class="forecast">
      ${hours.map(h=>`
        <div class="hour">
          <div class="hour-time">${h.t}</div>
          <div class="hour-icon">${iconHTML(h.c,1)}</div>
          <div class="hour-temp">${h.temp}°</div>
        </div>`).join("")}
    </div>
  `;

  function tick(){
    document.getElementById("clock").textContent =
      new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  }
  tick();
  setInterval(tick,1000);
}

async function load(){
  const url =
    `https://api.open-meteo.com/v1/forecast` +
    `?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}` +
    `&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,is_day` +
    `&hourly=temperature_2m,weather_code` +
    `&forecast_days=1&timezone=auto`;

  try{
    const res = await fetch(url);
    render(await res.json());
  }catch(e){
    document.getElementById("card").innerHTML =
      `<div class="loading">Meteo non disponibile</div>`;
  }
}

load();
setInterval(load, 10 * 60 * 1000);
</script>

</body>
</html>
