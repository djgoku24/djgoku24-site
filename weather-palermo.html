<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>METEO PALERMO ULTRA PREMIUM</title>

<style>

:root{
    --glass:rgba(255,255,255,.08);
    --white:#fff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:transparent;
}

/* VIDEO BACKGROUND */

.bg{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 20% 20%,#26408f 0%, transparent 40%),
    radial-gradient(circle at 80% 30%,#4b1d95 0%, transparent 30%),
    radial-gradient(circle at 50% 80%,#123b81 0%, transparent 35%),
    linear-gradient(180deg,#030712,#081126);
    animation:bgMove 20s ease infinite;
}

@keyframes bgMove{
    0%{filter:hue-rotate(0deg);}
    50%{filter:hue-rotate(20deg);}
    100%{filter:hue-rotate(0deg);}
}



/* CARD */

.weather{
    width:100%;
    max-width:950px;
    height:540px;

    position:relative;
    overflow:hidden;
    flex-shrink:0;

    background:
    linear-gradient(135deg,
    rgba(10,20,45,.75),
    rgba(15,30,60,.55));

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    border:1px solid rgba(255,255,255,.25);
    border-radius:35px;

    box-shadow:
    0 15px 50px rgba(0,0,0,.45),
    0 0 40px rgba(74,144,226,.15),
    inset 0 1px 0 rgba(255,255,255,.2);

    color:white;

    transform-origin:center center;
}



/* HEADER */

.header{
    text-align:center;
    padding-top:15px;
}

.city{
    font-size:28px;
    font-weight:700;
}

.date{
    margin-top:5px;
    font-size:13px;
    opacity:.8;
}

/* MAIN */

.main{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:30px;
    padding:20px;
}

.temp{
    font-size:80px;
    font-weight:300;
    min-width:180px;
}

/* ICONA METEO */

.weather-icon{
    width:120px;
    height:100px;
    flex-shrink:0;
}

.sun{
    position:absolute;
    top:6%;
    right:12%;

    width:clamp(36px, 9vw, 60px);
    height:clamp(36px, 9vw, 60px);

    border-radius:50%;
    background:#ffd500;

    box-shadow:
    0 0 20px #ffd500,
    0 0 50px #ffd500;

    animation:pulse 4s infinite;
}

.cloud{
    position:absolute;
    bottom:18%;
    left:8%;

    width:clamp(60px, 16vw, 100px);
    height:clamp(26px, 7vw, 42px);
    background:white;
    border-radius:100px;
}

.cloud::before{
    content:'';
    position:absolute;
    width:70px;
    height:70px;
    left:15px;
    top:-35px;
    background:white;
    border-radius:50%;
}

.cloud::after{
    content:'';
    position:absolute;
    width:55px;
    height:55px;
    right:15px;
    top:-25px;
    background:white;
    border-radius:50%;
}

/* GOCCE */

.rain{
    position:absolute;
    left:65px;
    bottom:0;
}

.rain span{
    display:inline-block;
    width:3px;
    height:25px;
    margin:4px;
    background:#7dd3fc;
    animation:rain .8s infinite linear;
}

.rain span:nth-child(2){animation-delay:.2s}
.rain span:nth-child(3){animation-delay:.4s}

@keyframes rain{
    0%{
        opacity:0;
        transform:translateY(0);
    }
    100%{
        opacity:1;
        transform:translateY(20px);
    }
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
    }
}

/* CONDIZIONI */

.conditions{
    flex:1;
    text-align:left;
}

.status{
    font-size:clamp(22px, 5vw, 34px);
}

.stats{
    display:flex;
    gap:25px;

    margin-top:15px;

    font-size:15px;

    flex-wrap:nowrap;
    align-items:center;
}


/* FORECAST */

.forecast{
    position:absolute;
    bottom:0;
    left:0;

    width:100%;
    height:110px;

    display:flex;
    justify-content:space-evenly;
    align-items:center;

    background:rgba(255,255,255,.05);
    border-top:1px solid rgba(255,255,255,.15);
    padding:0 8px;
}
}
.hour{
    text-align:center;
    transition:.3s;
}

.hour:hover{
    transform:scale(1.1);
}



.hour-icon{
    font-size:26px;
}

.hour-time,
.hour-temp{
    font-size:13px;
}

/* OROLOGIO DIGITALE */

.clock{
    position:absolute;
    top:20px;
    right:25px;

    padding:10px 18px;

    border-radius:15px;

    background:rgba(255,255,255,.08);
}




</style>
</head>
<body>



<div class="weather">

<div class="clock" id="clock"></div>

<div class="header">
    <div class="city">Palermo, Sicilia</div>
    <div class="date">Condizioni Meteo Live</div>
</div>

<div class="main">

    <div class="temp">17°C</div>

    <div class="weather-icon">

        <div class="sun"></div>

        <div class="cloud"></div>

        <div class="rain">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <div class="conditions">

        <div class="status">Pioggia</div>

        <div class="stats">
            <div>💨 8.7 m/s</div>
            <div>💧 77%</div>
            <div>🧭 763 mmHg</div>
        </div>

    </div>

</div>

<div class="forecast">

    <div class="hour">
        <div class="hour-time">18:00</div>
        <div class="hour-icon">🌦️</div>
        <div class="hour-temp">17°</div>
    </div>

    <div class="hour">
        <div class="hour-time">19:00</div>
        <div class="hour-icon">🌦️</div>
        <div class="hour-temp">17°</div>
    </div>

    <div class="hour">
        <div class="hour-time">20:00</div>
        <div class="hour-icon">🌦️</div>
        <div class="hour-temp">16°</div>
    </div>

    <div class="hour">
        <div class="hour-time">21:00</div>
        <div class="hour-icon">🌧️</div>
        <div class="hour-temp">16°</div>
    </div>

    <div class="hour">
        <div class="hour-time">22:00</div>
        <div class="hour-icon">🌧️</div>
        <div class="hour-temp">16°</div>
    </div>

    <div class="hour">
        <div class="hour-time">23:00</div>
        <div class="hour-icon">🌧️</div>
        <div class="hour-temp">15°</div>
    </div>

</div>

</div>

<script>

// OROLOGIO

function updateClock(){
    const now = new Date();

    document.getElementById('clock')
    .innerHTML=
    now.toLocaleTimeString('it-IT',{
        hour:'2-digit',
        minute:'2-digit'
    });
}

updateClock();
setInterval(updateClock,1000);




</script>

</body>
</html>
