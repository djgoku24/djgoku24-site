<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meteo</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif}

body{
  width:100%;
  height:100vh;
  overflow:hidden;
  color:#fff;
  transition:background 1s ease;
  background-size:cover;
  background-position:center;
}

/* SFONDI DINAMICI */
body.day-clear{
  background-image:url("https://app3.weatherwidget.org/skin/img/bg/clear_day.jpg");
}

body.night-clear{
  background-image:url("https://app3.weatherwidget.org/skin/img/bg/clear_night.jpg");
}

body.cloudy{
  background-image:url("https://app3.weatherwidget.org/skin/img/bg/cloudy_day.jpg");
}

body.night-cloudy{
  background-image:url("https://app3.weatherwidget.org/skin/img/bg/clear_night.jpg");
}

body.rain{
  background-image:url("https://app3.weatherwidget.org/skin/img/bg/rainy_day.jpg");
}

body.night-rain{
  background-image:url("https://app3.weatherwidget.org/skin/img/bg/rainy_night.jpg");
}

body.day-snow{
  background-image:url("https://app3.weatherwidget.org/skin/img/bg/cloudy_day_snow.jpg");
}

body.night-snow{
  background-image:url("https://app3.weatherwidget.org/skin/img/bg/cloudy_night_snow.jpg");
}

body.storm{
  background-image:url("https://.../storm.jpg");
}

.card{
  height:100%;
  padding:10px 12px 8px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  background:rgba(0,0,0,.18);
}

/* CITTÀ CENTRATA */
.city{
  text-align:center;
  font-size:15px;
  font-weight:700;
  text-shadow:0 1px 4px rgba(0,0,0,.4);
}

/* TEMPERATURA + ICONA + DESCRIZIONE */
.main{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

.temp{
  font-size:40px;
  font-weight:300;
  line-height:1;
  text-shadow:0 1px 4px rgba(0,0,0,.4);
}

.desc{
  font-size:12px;
  line-height:1.4;
  max-width:110px;
  text-shadow:0 1px 3px rgba(0,0,0,.4);
}

/* ===== ICONA GRANDE ANIMATA ===== */
.wx{
  position:relative;
  width:70px;
  height:60px;
  flex-shrink:0;
}

.moon{
  position:absolute;
  top:2px;
  right:16px;
  width:30px;
  height:30px;
  border-radius:50%;
  background:transparent;
  box-shadow:inset -9px 4px 0 0 #ffd500;
  filter:drop-shadow(0 0 8px rgba(255,213,0,.7));
  z-index:1;
}

.sun{
  position:absolute;
  top:0;
  right:14px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#ffd500;
  box-shadow:0 0 14px #ffd500,0 0 30px #ffd500;
  animation:pulse 4s infinite;
  z-index:1;
}

.cloud{
  position:absolute;
  bottom:10px;
  left:4px;
  width:52px;
  height:22px;
  background:#f4f7fb;
  border-radius:100px;
  animation:drift 6s ease-in-out infinite;
  z-index:2;
}

.cloud::before{
  content:'';
  position:absolute;
  width:28px;
  height:28px;
  left:7px;
  top:-14px;
  background:#f4f7fb;
  border-radius:50%;
}

.cloud::after{
  content:'';
  position:absolute;
  width:22px;
  height:22px;
  right:8px;
  top:-10px;
  background:#f4f7fb;
  border-radius:50%;
}

@keyframes drift{50%{transform:translateX(4px)}}
@keyframes pulse{50%{transform:scale(1.08)}}

.rain{
  position:absolute;
  left:16px;
  bottom:0;
  z-index:3;
}

.rain span{
  display:inline-block;
  width:2px;height:10px;margin:2px;
  background:#9fd8ff;border-radius:2px;
  animation:rain .8s infinite linear;
}

.rain span:nth-child(2){animation-delay:.2s}
.rain span:nth-child(3){animation-delay:.4s}

@keyframes rain{
  0%{opacity:0;transform:translateY(-4px)}
  100%{opacity:1;transform:translateY(10px)}
}

.bolt{
  position:absolute;
  left:24px;
  bottom:0;
  width:0;height:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:16px solid #ffd500;
  filter:drop-shadow(0 0 8px #ffd500);
  animation:flash 1.2s infinite;
  z-index:4;
}

@keyframes flash{0%,100%{opacity:.2}50%{opacity:1}}

/* ===== ICONA PICCOLA PER LE ORE ===== */
.mi{
  position:relative;
  width:30px;
  height:26px;
  margin:0;
  overflow:hidden;
}

.mi .wx{
  width:30px;
  height:26px;
}

.mi .moon{
  width:16px;
  height:16px;
  top:1px;
  right:7px;
  box-shadow:inset -5px 2px 0 0 #ffd500;
  filter:drop-shadow(0 0 4px rgba(255,213,0,.7));
}

.mi .sun{
  width:15px;
  height:15px;
  top:1px;
  right:7px;
  box-shadow:0 0 6px #ffd500;
}

.mi .cloud{
  width:22px;
  height:9px;
  bottom:3px;
  left:4px;
}

.mi .cloud::before{
  width:12px;
  height:12px;
  left:3px;
  top:-6px;
}

.mi .cloud::after{
  width:9px;
  height:9px;
  right:3px;
  top:-4px;
}

.mi .rain{
  left:6px;
  bottom:0;
}

.mi .rain span{
  width:1.5px;
  height:5px;
  margin:1px;
}

/* PREVISIONI ORARIE */
.forecast{
  position:relative;
  background:rgba(0,0,0,.25);
  border-radius:10px;
  padding:6px 28px;
}

.hours-track{
  display:flex;
  gap:4px;
  overflow-x:auto;
  scroll-behavior:smooth;
  scrollbar-width:none;
}

.hours-track::-webkit-scrollbar{
  display:none;
}

.hour{
  flex:1 1 0;
  min-width:0;
  text-align:center;
}
.hour-time{font-size:10px;opacity:.8}

.hour-icon{
  height:26px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hour-temp{font-size:11px;font-weight:700}

.loading{
  display:flex;align-items:center;justify-content:center;
  height:100%;opacity:.8;font-size:13px;
}


.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:20px;
  height:20px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  color:#fff;
  font-size:11px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.arrow:hover{background:rgba(255,255,255,.32)}
.arrow-left{left:3px}
.arrow-right{right:3px}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="loading">Caricamento meteo…</div>
</div>

<script>
/* ===== CAMBIA SOLO QUESTO PER OGNI CITTÀ ===== */
const CONFIG = {
  city:"Palermo",
  lat:38.1157,
  lon:13.3615
};
/* ============================================== */

const LABELS = {
  0:"Sereno",1:"Poco nuvoloso",2:"Parzialmente nuvoloso",3:"Molto nuvoloso",
  45:"Nebbia",48:"Nebbia",
  51:"Pioviggine",53:"Pioviggine",55:"Pioviggine",
  61:"Pioggia debole",63:"Pioggia",65:"Pioggia forte",
  71:"Neve",73:"Neve",75:"Neve forte",
  80:"Rovesci deboli",81:"Rovesci",82:"Rovesci forti",
  95:"Temporale",96:"Temporale",99:"Temporale forte"
};

function kindOf(code){
  if(code===0||code===1) return "clear";
  if(code===2||code===3||code===45||code===48) return "cloud";
  if((code>=51&&code<=67)||(code>=80&&code<=82)) return "rain";
  if(code>=71&&code<=77) return "snow";
  if(code>=95) return "storm";
  return "cloud";
}

function bgClass(code,isDay){
  const k = kindOf(code);
  if(k==="storm") return "storm";
  if(k==="snow") return isDay ? "day-snow" : "night-snow";
  if(k==="rain") return isDay ? "rain" : "night-rain";
  if(k==="cloud") return isDay ? "cloudy" : "night-cloudy";
  return isDay ? "day-clear" : "night-clear";
}

function iconHTML(code,isDay){
  const k = kindOf(code);
  const night = !isDay;
  let html = "";

  if(k==="clear"){
    html = night ? `<div class="moon"></div>` : `<div class="sun"></div>`;
  }
  else if(k==="cloud"){
    html = (night ? `<div class="moon"></div>` : `<div class="sun"></div>`) + `<div class="cloud"></div>`;
  }
  else if(k==="rain"){
    html = (night ? `<div class="moon"></div>` : `<div class="sun"></div>`)
         + `<div class="cloud"></div>
            <div class="rain"><span></span><span></span><span></span></div>`;
  }
  else if(k==="storm"){
    html = `<div class="cloud"></div>
            <div class="rain"><span></span><span></span><span></span></div>
            <div class="bolt"></div>`;
  }

  else if(k==="snow"){
  html = (night ? `<div class="moon"></div>` : `<div class="sun"></div>`)
       + `<div class="cloud"></div>`;
}

  return `<div class="wx">${html}</div>`;
}

function render(data){
  const c = data.current;
  const h = data.hourly;
  const isDay = c.is_day === 1;
  const nowHour = new Date(c.time).getHours();

  document.body.className = bgClass(c.weather_code, isDay);

const hours = [];
const now = new Date();

for(let i=0;i<h.time.length && hours.length<24;i++){
  const d = new Date(h.time[i]);

  if(d > now){
    hours.push({
      t:d.getHours().toString().padStart(2,"0")+":00",
      c:h.weather_code[i],
      temp:Math.round(h.temperature_2m[i])
    });
  }
}
  document.getElementById("card").innerHTML = `
    <div class="city">${CONFIG.city}</div>

    <div class="main">
      <div class="temp">${Math.round(c.temperature_2m)}°</div>
      ${iconHTML(c.weather_code, isDay)}
      <div class="desc">${LABELS[c.weather_code] || "Meteo"}</div>
    </div>

   <div class="forecast">
  <button class="arrow arrow-left" onclick="scrollHours(-1)">‹</button>
  <div class="hours-track" id="hoursTrack">
    ${hours.map(h=>`
      <div class="hour">
        <div class="hour-time">${h.t}</div>
        <div class="hour-icon"><div class="mi">${iconHTML(h.c,1)}</div></div>
        <div class="hour-temp">${h.temp}°</div>
      </div>`).join("")}
  </div>
  <button class="arrow arrow-right" onclick="scrollHours(1)">›</button>
</div>
  `;
}

async function load(){
  const url =
    `https://api.open-meteo.com/v1/forecast` +
    `?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}` +
    `&current=temperature_2m,weather_code,is_day` +
    `&hourly=temperature_2m,weather_code` +
    `&forecast_days=2&timezone=auto`;

  try{
    const res = await fetch(url);
    render(await res.json());
  }catch(e){
    document.getElementById("card").innerHTML =
      `<div class="loading">Meteo non disponibile</div>`;
  }
}

load();
setInterval(load, 10 * 60 * 1000);



function scrollHours(dir){
  const track = document.getElementById('hoursTrack');
  if(!track) return;
  const hour = track.querySelector('.hour');
  if(!hour) return;
  track.scrollBy({
    left: dir * (hour.offsetWidth + 4),
    behavior:'smooth'
  });
}
</script>

</body>
</html>
